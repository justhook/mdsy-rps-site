<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>몯페스 취향표 생성기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }


    .table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.table-guide {
  font-size: 12px;
  color: #888;
}

    .description {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
    }

    .table-wrapper {
      overflow-x: auto;
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid #ddd;
      text-align: center;
      height: 70px;
    }

    th {
  background: #2E4A58;
  color: white;
  font-weight: bold;
}

    th:first-child {
      width: 90px;
    }

    .cell {
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: bold;
      transition: 0.15s;
    }

    .cell:hover {
      transform: scale(0.95);
    }

    /* 상태별 색상 */

    .status-0 {
      background: white;
      color: #000;
    }

    .status-1 {
      background: #ffd6e0;
      color: #d94f70;
    }

    .status-2 {
      background: #ffe9b8;
      color: #b57a00;
    }

    .status-3 {
      background: #d9f2e3;
      color: #287a4b;
    }

    .status-4 {
      background: white;
      color: #000;
    }

    .status-5 {
      background: #d9d9d9;
      color: #555;
    }

    .status-6 {
      background: #333;
      color: white;
    }

    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 25px;
    }

    .legend-item {
        padding: 7px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: bold;
        font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .table-top-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 8px;
}

.table-top-buttons button {
  width: 36px;
  height: 32px;
  padding: 0;
  border-radius: 8px;
  background: white;
  color: #333;
  border: 1px solid #ddd;
  font-size: 18px;
  line-height: 1;
}

.table-top-buttons button:hover {
  background: #f0f0f0;
}

    .status-button {
  border: none;
  border-radius: 8px;
  width: 70px;
  height: 36px;
  margin: 4px;
  padding: 0;
  font-size: 12px;
  font-weight: bold;
  font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.status-button.status-1 {
  background: #ffd6e0;
  color: #d94f70;
}

.status-button.status-2 {
  background: #ffe9b8;
  color: #b57a00;
}

.status-button.status-3 {
  background: #d9f2e3;
  color: #287a4b;
}

.status-button.status-4 {
  background: white;
  color: #000;
  border: 1px solid #ddd;
}

.status-button.status-5 {
  background: #d9d9d9;
  color: #555;
}

.status-button.status-6 {
  background: #333;
  color: white;
}

.status-button:hover {
  opacity: 0.8;
}

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      background: #333;
      color: white;
      font-size: 14px;
    }

    .buttons button {
  background: #2E4A58;
}

    button:hover {
      opacity: 0.8;
    }

    .logo {
  text-align: center;
  margin-bottom: 15px;
}

.logo img {
  width: 500px;
  height: auto;
}

.date-option {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-top: 15px;
  margin-bottom: 5px;
  font-size: 13px;
  color: #555;
  cursor: pointer;
}

.date-option input {
  cursor: pointer;
}

.copyright {
  text-align: center;
  margin-top: 12px;
  font-size: 12px;
  color: #888;
}

.image-copyright {
  display: none;
  text-align: center;
  margin-top: 8px;
  font-size: 12px;
  color: #888;
}

@media (max-width: 600px) {

  body {
    padding: 20px 6px;
  }

  .container {
    width: 100%;
  }

  .logo {
    margin-bottom: 10px;
  }

  .logo img {
    width: 85%;
    max-width: 500px;
  }

  h1 {
    font-size: 21px;
    margin-bottom: 8px;
  }

  .table-header {
    margin-bottom: 6px;
    gap: 4px;
  }

  .table-guide {
    font-size: 9px;
  }

  .table-top-buttons {
    gap: 4px;
  }

  .table-top-buttons button {
    width: 28px;
    height: 27px;
    font-size: 15px;
  }

  .table-wrapper {
    padding: 5px;
    overflow: hidden;
    border-radius: 10px;
  }

  table {
    width: 100%;
    table-layout: fixed;
  }

  th,
  td {
    height: 48px;
    padding: 2px;
  }

  th {
    font-size: 10px;
  }

  th:first-child {
    width: 38px;
  }

  .cell {
    font-size: 9px;
  }

  .legend {
    gap: 4px;
    margin-top: 15px;
  }

  .legend-item {
    padding: 5px 7px;
    font-size: 9px;
    border-radius: 6px;
  }

  .date-option {
    margin-top: 12px;
    margin-bottom: 3px;
    font-size: 11px;
  }

  .buttons {
    gap: 7px;
    margin-top: 18px;
  }

  .buttons button {
    padding: 8px 12px;
    font-size: 12px;
  }

  .copyright {
    margin-top: 10px;
    font-size: 10px;
  }

}

  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
    <img src="logo.jpg" alt="그룹 로고">
  </div>

    <div id="captureArea">

    <h1>RPS 취향표</h1>

    <div class="table-header">
      <div class="table-guide">
        멤버의 이름을 누르면 그 줄 전체를 설정할 수 있어요
      </div>

      <div class="table-top-buttons">
        <button onclick="undo()">↶</button>
        <button onclick="redo()">↷</button>
      </div>
    </div>

    <div class="table-wrapper">

      <table id="tasteTable">
        <thead>
          <tr id="headerRow">
            <th></th>
            <th>이첸</th>
            <th>헝위</th>
            <th>로완</th>
            <th>린린</th>
            <th>리즈하오</th>
            <th>수런</th>
            <th>판저이</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>
      </table>

    </div>

    <div class="legend">
      <div class="legend-item status-1">OTP</div>
      <div class="legend-item status-2">호감</div>
      <div class="legend-item status-3">가능</div>
      <div class="legend-item status-4">무관심</div>
      <div class="legend-item status-5">별로</div>
      <div class="legend-item status-6">지뢰</div>
    </div>

        <div class="image-copyright">
      @ppappi413
    </div>

          <label class="date-option">
        <input type="checkbox" id="showDate">
        이미지에 날짜 표시하기
      </label>

  </div>

  <div class="buttons">
    <button onclick="resetTable()">초기화</button>
    <button onclick="saveAsImage()">사진으로 저장</button>
  </div>

  <div class="copyright">
  @ppappi413
</div>

  </div>


 <script>

  const members = [
    { name: "이첸", short: "첸" },
    { name: "헝위", short: "넝" },
    { name: "로완", short: "윗" },
    { name: "린린", short: "륀" },
    { name: "리즈하오", short: "룆" },
    { name: "수런", short: "런" },
    { name: "판저이", short: "판" }
  ];

  const statuses = [
    "",
    "OTP",
    "호감",
    "가능",
    "무관심",
    "별로",
    "지뢰"
  ];


  // 표 만들기
  function createTable() {

    const headerCells = document.querySelectorAll("#headerRow th");

headerCells.forEach((headerCell, index) => {

  // 첫 번째 빈 칸은 제외
  if (index === 0) {
    return;
  }

  headerCell.style.cursor = "pointer";

  headerCell.addEventListener("click", () => {
    showColumnMenu(index - 1);
  });

});

    const tableBody = document.getElementById("tableBody");

    members.forEach((rowMember, rowIndex) => {

      const row = document.createElement("tr");

      // 왼쪽 세로 이름
      const nameCell = document.createElement("th");

      nameCell.innerText = rowMember.short;

      // 이름을 클릭하면 줄 전체 상태 설정
      nameCell.style.cursor = "pointer";

      nameCell.addEventListener("click", () => {
        showRowMenu(rowIndex);
      });

      row.appendChild(nameCell);


      // 가로 방향으로 CP 만들기
      members.forEach((columnMember, columnIndex) => {

        const cell = document.createElement("td");

        // 자기 자신과의 조합
        if (rowIndex === columnIndex) {

          cell.innerText = "-";
          cell.style.background = "#f3f3f3";
          cell.style.color = "#aaa";

        } else {

          cell.classList.add("cell");
          cell.classList.add("status-0");

          cell.dataset.status = "0";

          // CP명
          cell.innerText =
            rowMember.short + columnMember.short;

          // 클릭하면 해당 CP만 상태 변경
          cell.addEventListener("click", () => {
            changeStatus(cell);
          });

        }

        row.appendChild(cell);

      });

      tableBody.appendChild(row);

    });

  }


  // 개별 CP 클릭 → 상태 변경
  // 개별 CP 클릭 → 상태 선택창
function changeStatus(cell) {

  // 기존 메뉴가 있으면 삭제
  const oldMenu = document.querySelector(".cell-menu");

  if (oldMenu) {
    oldMenu.remove();
  }


  const menu = document.createElement("div");

  menu.className = "cell-menu";

  menu.style.position = "fixed";
  menu.style.left = "50%";
  menu.style.top = "50%";
  menu.style.transform = "translate(-50%, -50%)";

  menu.style.background = "white";
  menu.style.padding = "20px";
  menu.style.borderRadius = "15px";
  menu.style.boxShadow = "0 5px 25px rgba(0,0,0,0.2)";
  menu.style.zIndex = "1000";
  menu.style.textAlign = "center";


  // 상태 선택 버튼
  statuses.forEach((status, statusIndex) => {

  // 빈 상태는 선택창에서 제외
  if (statusIndex === 0) {
    return;
  }

  const button = document.createElement("button");

button.innerText = status;
button.className = "status-button status-" + statusIndex;

  button.addEventListener("click", () => {

    cell.dataset.status = statusIndex;

    cell.className = "cell status-" + statusIndex;

    saveState();

    menu.remove();

  });

  menu.appendChild(button);

});


  // 취소 버튼
  const cancelButton = document.createElement("button");

  cancelButton.innerText = "취소";

  cancelButton.style.margin = "4px";
  cancelButton.style.background = "#aaa";

  cancelButton.addEventListener("click", () => {
    menu.remove();
  });

  menu.appendChild(cancelButton);


  document.body.appendChild(menu);

}


  // 왼쪽 이름을 클릭했을 때 상태 선택창
  function showRowMenu(rowIndex) {

    // 기존 메뉴가 있으면 삭제
    const oldMenu = document.querySelector(".row-menu");

    if (oldMenu) {
      oldMenu.remove();
    }


    const menu = document.createElement("div");

    menu.className = "row-menu";

    menu.style.position = "fixed";
    menu.style.left = "50%";
    menu.style.top = "50%";
    menu.style.transform = "translate(-50%, -50%)";

    menu.style.background = "white";
    menu.style.padding = "20px";
    menu.style.borderRadius = "15px";
    menu.style.boxShadow = "0 5px 25px rgba(0,0,0,0.2)";
    menu.style.zIndex = "1000";
    menu.style.textAlign = "center";


    // 상태 버튼 만들기
    statuses.forEach((status, statusIndex) => {

      // 빈 상태는 메뉴에서 제외
      if (statusIndex === 0) {
        return;
      }

      const button = document.createElement("button");

button.innerText = status;
button.className = "status-button status-" + statusIndex;


      button.addEventListener("click", () => {

        setRowStatus(rowIndex, statusIndex);

        saveState();

        menu.remove();

      });


      menu.appendChild(button);

    });


    // 취소 버튼
    const cancelButton = document.createElement("button");

    cancelButton.innerText = "취소";

    cancelButton.style.margin = "4px";
    cancelButton.style.background = "#aaa";

    cancelButton.addEventListener("click", () => {
      menu.remove();
    });

    menu.appendChild(cancelButton);


    document.body.appendChild(menu);

  }


  // 해당 줄 전체 상태 변경
  function setRowStatus(rowIndex, statusIndex) {

    const row = document.querySelectorAll("#tableBody tr")[rowIndex];

    const cells = row.querySelectorAll(".cell");


    cells.forEach(cell => {

      cell.dataset.status = statusIndex;

      cell.className = "cell status-" + statusIndex;

    });

  }

  // 위쪽 이름을 클릭했을 때 상태 선택창
function showColumnMenu(columnIndex) {

  const oldMenu = document.querySelector(".column-menu");

  if (oldMenu) {
    oldMenu.remove();
  }

  const menu = document.createElement("div");

  menu.className = "column-menu";

  menu.style.position = "fixed";
  menu.style.left = "50%";
  menu.style.top = "50%";
  menu.style.transform = "translate(-50%, -50%)";

  menu.style.background = "white";
  menu.style.padding = "20px";
  menu.style.borderRadius = "15px";
  menu.style.boxShadow = "0 5px 25px rgba(0,0,0,0.2)";
  menu.style.zIndex = "1000";
  menu.style.textAlign = "center";


  // 상태 버튼 만들기
  statuses.forEach((status, statusIndex) => {

    // 빈 상태는 메뉴에서 제외
    if (statusIndex === 0) {
      return;
    }

    const button = document.createElement("button");

    button.innerText = status;
    button.className = "status-button status-" + statusIndex;

    button.addEventListener("click", () => {

      setColumnStatus(columnIndex, statusIndex);

      saveState();

      menu.remove();

    });

    menu.appendChild(button);

  });


  // 취소 버튼
  const cancelButton = document.createElement("button");

  cancelButton.innerText = "취소";

  cancelButton.className = "status-button";
  cancelButton.style.background = "#aaa";
  cancelButton.style.color = "white";

  cancelButton.addEventListener("click", () => {
    menu.remove();
  });

  menu.appendChild(cancelButton);


  document.body.appendChild(menu);

}


// 해당 열 전체 상태 변경
function setColumnStatus(columnIndex, statusIndex) {

  const rows = document.querySelectorAll("#tableBody tr");

  rows.forEach(row => {

    const cell = row.cells[columnIndex + 1];

    // 자기 자신(-)은 제외
    if (cell && cell.classList.contains("cell")) {

      cell.dataset.status = statusIndex;

      cell.className = "cell status-" + statusIndex;

    }

  });

}

let history = [];
let historyIndex = -1;


// 현재 표 상태 저장
function saveState() {

  const cells = document.querySelectorAll(".cell");

  const state = [];

  cells.forEach(cell => {
    state.push(cell.dataset.status);
  });

  // 현재 위치 이후의 기록은 삭제
  history = history.slice(0, historyIndex + 1);

  history.push(state);

  historyIndex++;

}


// 저장된 상태 불러오기
function loadState(state) {

  const cells = document.querySelectorAll(".cell");

  cells.forEach((cell, index) => {

    cell.dataset.status = state[index];
    cell.className = "cell status-" + state[index];

  });

}


// 뒤로가기
function undo() {

  if (historyIndex <= 0) {
    return;
  }

  historyIndex--;

  loadState(history[historyIndex]);

}


// 재실행
function redo() {

  if (historyIndex >= history.length - 1) {
    return;
  }

  historyIndex++;

  loadState(history[historyIndex]);

}

  // 초기화
  function resetTable() {

    const cells = document.querySelectorAll(".cell");

    cells.forEach(cell => {

      cell.dataset.status = "0";

      cell.className = "cell status-0";

      const rowIndex = cell.parentElement.rowIndex - 1;
      const columnIndex = cell.cellIndex - 1;

      cell.innerText =
        members[rowIndex].short +
        members[columnIndex].short;

    });

    saveState();

  }

   // 취향표를 사진으로 저장
   function saveAsImage() {

  const target = document.getElementById("captureArea");
  const tableHeader = document.querySelector(".table-header");
  const showDate = document.getElementById("showDate");
  const dateOption = document.querySelector(".date-option");
  const imageCopyright = document.querySelector(".image-copyright");

  if (typeof html2canvas === "undefined") {
    alert("사진 저장 기능을 불러오지 못했어요. 페이지를 새로고침해 주세요.");
    return;
  }

  // 사진 찍을 때만 문구 + 뒤로가기/재실행 + 날짜 체크박스 숨기기
tableHeader.style.display = "none";
dateOption.style.display = "none";
imageCopyright.style.display = "block";

  // 날짜 표시가 체크되어 있을 때만 날짜 추가
  let dateElement = null;

  if (showDate.checked) {
  dateElement = document.createElement("div");

  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  dateElement.innerText = `${year}.${month}.${day}`;

  dateElement.style.textAlign = "center";
  dateElement.style.fontSize = "13px";
  dateElement.style.color = "#888";
  dateElement.style.marginTop = "15px";

  // 날짜를 먼저 추가
  target.appendChild(dateElement);

  // 저작자 표시를 날짜 아래로 이동
  target.appendChild(imageCopyright);
}

  html2canvas(target, {
    backgroundColor: "#f7f7f7",
    scale: 2,
    useCORS: true,
    allowTaint: false
  }).then(canvas => {

    const link = document.createElement("a");

    link.download = "RPS_취향표.png";
    link.href = canvas.toDataURL("image/png");

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 날짜는 사진에만 들어가고 사이트에서는 다시 제거
    if (dateElement) {
      dateElement.remove();
    }

    // 다시 화면에 표시
tableHeader.style.display = "flex";
dateOption.style.display = "flex";
imageCopyright.style.display = "none";

  }).catch(error => {

    console.error("사진 저장 오류:", error);

    // 오류가 나도 날짜 제거
    if (dateElement) {
      dateElement.remove();
    }

    // 오류가 나도 다시 화면에 표시
tableHeader.style.display = "flex";
dateOption.style.display = "flex";
imageCopyright.style.display = "none";

    alert("사진 저장에 실패했어요.");

  });

}

  createTable();
  saveState();

</script>
